name: Setup toolchain
description: Go (from go.mod), Node + pnpm (from web/package.json) and Task, with caching.

inputs:
  node:
    description: Also set up Node and pnpm
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - if: inputs.node == 'true'
      uses: actions/setup-node@v7
      with:
        node-version: 22

    - if: inputs.node == 'true'
      uses: pnpm/action-setup@v6
      with:
        package_json_file: web/package.json
        cache: true
        cache_dependency_path: web/pnpm-lock.yaml

    - uses: go-task/setup-task@v2
      with:
        version: 3.x
